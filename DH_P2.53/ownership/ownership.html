<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Dynasty Hub</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@200;300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Product+Sans:wght@100;200;300;400;500;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css?family=Google+Sans:100,200,300,400,500,600,700" rel="stylesheet"/>
<link href="../manifest.webmanifest?v=20250827002411?v=20250826235225" rel="manifest"/><link rel="apple-touch-icon" sizes="180x180" href="../assets/icons/apple-touch-icon-180.png?v=20250926r5c" /><meta content="#0D0E1B" name="theme-color"/><link href="../styles/styles.css?v=20250827002411?v=20250826235225" rel="stylesheet"/><script src="https://cdn.tailwindcss.com"></script>  <link rel="icon" type="image/png" sizes="32x32" href="../assets/icons/favicon-32.png?v=20250926r5c" />
<link rel="icon" type="image/png" sizes="16x16" href="../assets/icons/favicon-16.png?v=20250926r5c" />
<link rel="shortcut icon" href="../assets/icons/favicon.ico?v=20250926r5c" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer"/>
<link rel="stylesheet" href="../styles/ownership.css"/>
</head>
<body data-page="ownership" class="p-2 sm:p-4">
<!-- Replaced Background: Starfield -->
<div aria-hidden="true" id="starfield">
<div id="stars"></div>
<div id="stars1"></div>
<div id="stars2"></div>
<div id="stars3"></div>
</div>
<div id="noise-overlay"></div>
<!-- EDITED: Added a class for layout control -->
<div class="relative z-10 content-wrapper">
<div id="header-container">
<header class="app-header glass-panel">
    <div class="header-row" id="primary-header-row">
        <div class="nav-buttons-container">
            <button class="nav-button" id="homeButton" data-nav="home">
                <img src="../assets/logos/App_Logo_icon256.png" alt="Dynasty Hub" class="nav-logo" aria-hidden="true" />
                <span class="nav-label">Home</span>
            </button>
            <button class="nav-button" id="rostersButton" data-nav="rosters">
                <i class="fa-solid fa-clipboard-list" aria-hidden="true"></i>
                <span class="nav-label">Rosters</span>
            </button>
            <button class="nav-button" id="statsButton" data-nav="stats">
                <i class="fa-solid fa-chart-column" aria-hidden="true"></i>
                <span class="nav-label">Stats</span>
            </button>
            <button class="nav-button" id="analyzerButton" data-nav="analyzer">
                <i class="fa-solid fa-square-poll-vertical" aria-hidden="true"></i>
                <span class="nav-label">L.Analyze</span>
            </button>
            <button class="nav-button" id="researchButton" data-nav="research">
                <i class="fa-solid fa-flask" aria-hidden="true"></i>
                <span class="nav-label">Research</span>
            </button>
      <button class="nav-button nav-more-toggle" id="moreButton" aria-haspopup="true" aria-expanded="false">
        <i class="fa-solid fa-toolbox" aria-hidden="true"></i>
        <span class="nav-label">More</span>
        <i class="fa-solid fa-caret-down nav-more-caret" aria-hidden="true"></i>
      </button>
      <div class="nav-more-dropdown hidden" id="moreDropdown" role="menu" aria-hidden="true">
        <button class="nav-more-item active" data-nav="ownership" role="menuitem">
          <i class="fa-solid fa-percent" aria-hidden="true"></i>
          <span class="nav-label">Ownership</span>
        </button>
                <button class="nav-more-item" data-url="https://dynastyhub-trophyroom.netlify.app/" role="menuitem">
          <i class="fa-solid fa-trophy" aria-hidden="true"></i>
                    <span class="nav-label">Trophy Room</span>
        </button>
                <button class="nav-more-item" data-url="http://dynastyhub-matchups.netlify.app/" role="menuitem">
          <i class="fa-solid fa-table-columns" aria-hidden="true"></i>
          <span class="nav-label">Matchups</span>
        </button>
      </div>
        </div>
    </div>
    <div id="contextual-controls">
        <div class="header-row" id="secondary-header-row">
            <div class="username-area">
                <input autocapitalize="none" autocomplete="username" autocorrect="off" id="usernameInput" inputmode="text" name="username" placeholder="SLPR Username..." type="text" value="The_Oracle"/>
            </div>

        </div>
        <div class="header-row" id="filters-row">

            <div class="filters-container">
                <div id="positional-filters">
                    <button class="filter-btn" data-position="QB">QB</button>
                    <button class="filter-btn" data-position="RB">RB</button>
                    <button class="filter-btn" data-position="WR">WR</button>
                    <button class="filter-btn" data-position="TE">TE</button>

                </div>
                <button class="control-button-subtle" id="clearFiltersButton">
                    <span class="clear-filters-stack">
                        <i class="fa-solid fa-filter-circle-xmark" aria-hidden="true"></i>
                        <span class="sr-only">Clear filters</span>
                    </span>
                </button>

            </div>
        </div>
    </div>
</header>
</div>
<main class="container mx-auto" id="content">
<div id="loading" class="hidden">
  <div class="loading-overlay" role="alert" aria-live="polite">
    <div class="loading-spinner" aria-hidden="true"></div>
    <div class="loading-body">
      <img
        src="../assets/welcome/welcome-logo-256.png"
        alt="Dynasty Hub"
        width="216"
        height="216"
        decoding="async"
        loading="eager"
        class="loading-logo"
      />
      <div class="loading-text">
        <span class="loading-message">Loading…</span>
      </div>
    </div>
  </div>
</div>

<!-- Ownership / Player Value view toggle -->
<div class="ownership-view-switcher" id="ownership-view-switcher">
    <button class="ov-switch-btn active" id="ownershipViewBtn" data-view="ownership" aria-pressed="true">Ownership</button>
    <button class="ov-switch-btn" id="playerValueViewBtn" data-view="playerValue" aria-pressed="false">Player Value</button>
</div>

<!-- Ownership list view (rendered by app.js) -->
<div id="playerListView"></div>

<!-- Player Value table view (rendered by app.js) -->
<div class="hidden" id="playerValueView"></div>

</main>

</div>

<!-- Player Detail Modal (ownership-specific) — placed outside content-wrapper for correct stacking -->
<div class="ov-modal-overlay" id="ownershipPlayerModal" aria-hidden="true">
  <div class="ov-modal glass-panel" role="dialog" aria-modal="true" aria-label="Player Details">
    <button class="modal-close-btn" id="ovModalCloseBtn" aria-label="Close">&times;</button>
    <div class="ov-modal-header" id="ovModalHeader">
      <!-- JS inserts .modal-header-left-container here (pos tag + team logo) -->
      <h3 id="ovModalPlayerName">Player Details</h3>
    </div>
    <!-- Player vitals row (age/height/weight/exp/ry) -->
    <div id="ovModalVitals" class="ov-modal-vitals"></div>
    <!-- Summary chips: FPTS, PPG, KTC -->
    <div id="ovModalChips" class="ov-modal-chips"></div>
    <!-- Ownership summary text -->
    <div id="ovModalOwnershipSummary" class="ov-modal-ownership-summary"></div>
    <!-- Per-league breakdown rows -->
    <div id="ovModalLeagueRows" class="ov-modal-league-breakdown"></div>
  </div>
</div>

<script defer="True" src="../scripts/app.js?v=20260116"></script>
</body>
</html>
