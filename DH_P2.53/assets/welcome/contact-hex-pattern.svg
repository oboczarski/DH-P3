<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 800" fill="none">
  <defs>
    <linearGradient id="hexGradA" x1="0" y1="0" x2="500" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="rgba(3,48,93,0.58)" />
      <stop offset="1" stop-color="rgba(204,5,189,0.64)" />
    </linearGradient>
    <linearGradient id="hexGradB" x1="0" y1="0" x2="500" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="rgba(29,32,71,0.52)" />
      <stop offset="1" stop-color="rgba(120,5,255,0.73)" />
    </linearGradient>

    <!-- Contact page honeycomb pattern: preserved from the old shared asset so the
         Contact page keeps the same sparse dual-tone hex treatment after dashboard
         moved to the RB infographic background. -->
    <g id="hexPrimary">
      <polygon points="25 0 50 14.5 50 43.5 25 58 0 43.5 0 14.5" stroke="url(#hexGradA)" stroke-width="2" />
      <circle cx="25" cy="0" r="2.4" fill="#78b8ff" fill-opacity="0.8" />
      <circle cx="50" cy="14.5" r="2.4" fill="#bb61ff" fill-opacity="0.82" />
      <circle cx="50" cy="43.5" r="2.4" fill="#ff63c8" fill-opacity="0.84" />
      <circle cx="25" cy="58" r="2.4" fill="#ff63c8" fill-opacity="0.84" />
      <circle cx="0" cy="43.5" r="2.4" fill="#8b7cff" fill-opacity="0.76" />
      <circle cx="0" cy="14.5" r="2.4" fill="#78b8ff" fill-opacity="0.8" />
    </g>

    <g id="hexSecondary">
      <polygon points="25 0 50 14.5 50 43.5 25 58 0 43.5 0 14.5" stroke="url(#hexGradB)" stroke-width="2" />
      <circle cx="25" cy="0" r="2.2" fill="#5d78ff" fill-opacity="0.62" />
      <circle cx="50" cy="14.5" r="2.2" fill="#834fff" fill-opacity="0.68" />
      <circle cx="50" cy="43.5" r="2.2" fill="#a53fff" fill-opacity="0.72" />
      <circle cx="25" cy="58" r="2.2" fill="#a53fff" fill-opacity="0.72" />
      <circle cx="0" cy="43.5" r="2.2" fill="#6c74ff" fill-opacity="0.64" />
      <circle cx="0" cy="14.5" r="2.2" fill="#5d78ff" fill-opacity="0.62" />
    </g>
  </defs>

