<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Fantasy Football Roster</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#4c12ed",
            "background-light": "#f6f6f8",
            "background-dark": "#151022",
            "accent-green": "#00FF87",
          },
          fontFamily: {
            "display": ["Be Vietnam Pro", "sans-serif"]
          },
          borderRadius: {
            "DEFAULT": "0.5rem",
            "lg": "1rem",
            "xl": "1.5rem",
            "full": "9999px"
          },
        },
      },
    }
  </script>
<style>
    .glass-panel {
      background: rgba(45, 40, 57, 0.4);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }
    .glass-button-shaded {
      background: rgba(255, 255, 255, 0.05);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display">
<div class="relative flex h-auto min-h-screen w-full flex-col overflow-x-hidden">
<div class="fixed bottom-0 left-0 right-0 z-10 p-4">
<div class="glass-panel flex h-16 w-full items-stretch justify-between rounded-xl overflow-hidden">
<button class="flex h-full basis-16 items-center justify-center transition-transform active:scale-95">
<span class="material-symbols-outlined text-white">chevron_left</span>
</button>
<div class="w-px shrink-0 bg-white/10"></div>
<button class="flex-grow px-4 text-center">
<div class="flex flex-col items-center justify-center">
<div class="flex items-center gap-1">
<p class="font-display truncate font-semibold text-white">Sunday Warriors League</p>
<span class="material-symbols-outlined text-base text-white">arrow_drop_down</span>
</div>
<p class="text-xs font-medium text-white/60">Change League</p>
</div>
</button>
<div class="w-px shrink-0 bg-white/10"></div>
<button class="flex h-full basis-16 items-center justify-center transition-transform active:scale-95">
<span class="material-symbols-outlined text-white">chevron_right</span>
</button>
</div>
</div>
</div>

</body></html>
